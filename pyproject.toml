[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tradebot"
version = "0.1.0"
description = "Paper-first, multi-asset crypto trading system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff==0.17.2",
  "types-PyYAML>=6.0,<7",
]
storage = [
  "duckdb>=1.0,<2",
  "pyarrow>=17,<22",
]
dashboard = [
  "streamlit>=1.38,<2",
]

[project.scripts]
tradebot = "tradebot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tradebot"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tradebot"]
mypy_path = "src"
